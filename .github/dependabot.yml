# Weekly dependency update PRs. Each PR runs the full CI, so an update only merges if everything still passes.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Copenhagen
    open-pull-requests-limit: 10
    versioning-strategy: increase
    commit-message:
      prefix: "build(deps)"
    groups:
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
      nextjs-react:
        patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react", "@types/react-dom"]
      nestjs:
        patterns: ["@nestjs/*"]
      prisma:
        patterns: ["prisma", "@prisma/*"]
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@playwright/test"
          - "@testing-library/*"
          - "jsdom"
          - "supertest"
          - "@types/supertest"
          - "@vitejs/plugin-react"
          - "unplugin-swc"
          - "@swc/core"
      lint-format:
        patterns: ["eslint", "@eslint/*", "typescript-eslint", "prettier", "globals"]
      other-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Blocked until typescript-eslint and @nestjs/swagger support TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Blocked until eslint-config-next's plugins support ESLint 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # Keep @types/node on the Node.js LTS major used in .nvmrc and the Dockerfiles.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/backend", "/frontend"]
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build(docker)"
    groups:
      base-images:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directories: ["/", "/deploy"]
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build(docker)"
