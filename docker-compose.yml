name: greenforce

# Local stack: docker compose up --build
#   Frontend: http://localhost:${FRONTEND_PORT:-3000}
#   API docs: http://localhost:${BACKEND_PORT:-4000}/api/docs
# Host ports/bind addresses can be overridden from the shell or a root .env file.

x-service-defaults: &service-defaults
  restart: on-failure:5
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-backend-env: &backend-env
  env_file:
    - path: backend/.env.example
      required: true
    - path: backend/.env
      required: false

services:
  postgres:
    <<: [*service-defaults, *backend-env]
    image: postgres:18.6-alpine3.24
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    shm_size: 256mb
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -p 5432 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s

  # One-shot job: applies Prisma migrations, then seeds demo data when DEMO_MODE=true (idempotent).
  migrate:
    <<: [*service-defaults, *backend-env]
    restart: "no"
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migrate
    image: greenforce-api-migrate:local
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      UPLOAD_DIR: /app/backend/uploads
    volumes:
      - uploads:/app/backend/uploads
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: [*service-defaults, *backend-env]
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: greenforce-api:local
    environment:
      NODE_ENV: production
      API_PORT: "4000"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      UPLOAD_DIR: /app/backend/uploads
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-4000}:4000"
    volumes:
      - uploads:/app/backend/uploads
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
      start_interval: 2s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    <<: *service-defaults
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Next.js rewrites are resolved at build time: where the frontend server reaches the API.
        API_INTERNAL_URL: ${API_INTERNAL_URL:-http://backend:4000}
    image: greenforce-web:local
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp
      - /app/frontend/.next/cache:uid=1000,gid=1000
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/login"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 2s
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  uploads:
